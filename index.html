<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIBES CLUB</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#111;
    color:#fff;
}

/* HEADER */
.header{
    text-align:center;
    padding: 20px 70px;
    background:#1a1a1a;
    border-bottom:1px solid #333;
    position:relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 40px;
}

.header h1{
    margin:0;
    font-size:24px;
    letter-spacing: 1px;
}

/* SETTINGS & ADMIN BUTTONS */
.settings-btn{
    position:absolute;
    top:15px;
    right:15px;
    width:45px;
    height:45px;
    background:#222;
    border: 1px solid #333;
    border-radius: 12px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:20px;
    z-index: 1000;
    transition: background 0.2s, border-color 0.2s;
}

.admin-btn{
    position:absolute;
    top:15px;
    left:15px;
    width:45px;
    height:45px;
    background:#222;
    border: 1px solid #333;
    border-radius: 12px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:20px;
    z-index: 1000;
    transition: background 0.2s, border-color 0.2s;
}

.settings-btn:hover, .admin-btn:hover{
    background: #2a2a2a;
    border-color: #555;
}

.admin-btn.logged-in{
    background:#ff4444;
    border-color: #ff6666;
}

.settings{
    position:absolute;
    top:70px;
    right:15px;
    width:180px;
    background:#1e1e1e;
    border-radius:12px;
    border: 1px solid #333;
    display:none;
    z-index: 1010;
    overflow: hidden;
}

.settings.active{
    display:block;
}

.lang{
    padding:12px;
    cursor:pointer;
    transition: background 0.2s;
}

.lang:hover{
    background:#333;        
}

/* TABS */
.tabs{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    padding:15px;
}

.tab{
    background:#222;
    padding:10px 16px;
    border-radius:10px;
    cursor:pointer;
}

.tab.active{
    background:red;
}

/* MENU */
.menu{
    display:none;
    max-width:800px;
    margin:auto;
    padding:15px;
}

.menu.active{
    display:block;
}

/* DRINK */
.drink{
    background:#1e1e1e;
    border-radius:12px;
    margin-bottom:10px;
    cursor:pointer;
    overflow:hidden;
    position:relative;
}

.drink-header{
    display:flex;
    justify-content:space-between;
    padding:15px;
    align-items:center;
}

.drink-header:hover{
    background:#2a2a2a;
}

.drink-actions{
    display:none;
    gap:8px;
}

.drink.admin-mode .drink-actions{
    display:flex;
}

.drink-actions button{
    background:#444;
    border:none;
    color:#fff;
    padding:5px 10px;
    border-radius:5px;
    cursor:pointer;
    font-size:12px;
}

.drink-actions button:hover{
    background:#666;
}

.drink-actions .delete-btn{
    background:#cc0000;
}

.drink-actions .delete-btn:hover{
    background:#ff0000;
}

.drink-info{
    display:none;
    padding:15px;
    border-top:1px solid #333;
    color:#ccc;
}

.drink.active .drink-info{
    display:block;
}

.price{
    color:red;
    font-weight:bold;
}

/* FOOTER */
.footer{
    text-align:center;
    padding:25px;
    color:#aaa;
    border-top:1px solid #333;
    margin-top:20px;
}

.address{
    margin-top:8px;
    color:#fff;
    font-size:14px;
}

/* MODAL */
.modal{
    display:none;
    position:fixed;
    z-index:1000;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background-color:rgba(0,0,0,0.7);
}

.modal.active{
    display:flex;
    align-items:center;
    justify-content:center;
}

.modal-content{
    background:#1e1e1e;
    padding:30px;
    border-radius:15px;
    max-width:500px;
    width:90%;
    border:1px solid #333;
    max-height:90vh;
    overflow-y:auto;
    position: relative; /* Чтобы крестик позиционировался внутри */
}

/* КНОПКА-КРЕСТИК ДЛЯ ЗАКРЫТИЯ */
.close-modal-btn {
    position: absolute;
    top: 15px;
    right: 15px;
    background: transparent;
    border: none;
    color: #aaa;
    font-size: 22px;
    cursor: pointer;
    line-height: 1;
    padding: 5px;
    transition: color 0.2s;
}

.close-modal-btn:hover {
    color: #ff0000;
}

.modal-content h2{
    margin-top:0;
    padding-right:30px; /* Чтобы заголовок не налезал на крестик */
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    padding:10px;
    border:1px solid #444;
    border-radius:5px;
    background:#222;
    color:#fff;
    box-sizing:border-box;
}

.form-group textarea{
    resize:vertical;
    min-height:80px;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
    outline:none;
    border-color:#ff0000;
}

.modal-buttons{
    display:flex;
    gap:10px;
    justify-content:flex-end;
}

.modal-buttons button{
    padding:10px 20px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-weight:bold;
}

.btn-save{
    background:#ff0000;
    color:#fff;
}

.btn-save:hover{
    background:#cc0000;
}

.btn-cancel{
    background:#444;
    color:#fff;
}

.btn-cancel:hover{
    background:#555;
}

.btn-add-drink{
    background:#ff0000;
    color:#fff;
    padding:10px 20px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    margin:15px auto;
    display:none;
    block-size:block;
}

.btn-add-drink.admin-mode{
    display:block;
}

.btn-add-drink:hover{
    background:#cc0000;
}

.error{
    color:#ff4444;
    font-size:12px;
    margin-top:5px;
}

.success{
    color:#44ff44;
    font-size:12px;
    margin-top:5px;
}

.admin-panel-btn{
    background:#ff0000;
    color:#fff;
    padding:10px 20px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    margin-top:10px;
    width:100%;
    font-weight:bold;
}

.admin-panel-btn:hover{
    background:#cc0000;
}

.logout-btn{
    background:#cc0000;
    color:#fff;
    padding:10px 20px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    margin-top:10px;
    width:100%;
    font-weight:bold;
}

.logout-btn:hover{
    background:#990000;
}

.user-info{
    padding:15px;
    background:#222;
    border-radius:5px;
    margin-bottom:15px;
    font-size:14px;
}

.add-drink-container{
    text-align:center;
}
</style>
</head>

<body>

<!-- ADMIN BUTTON -->
<div class="admin-btn" onclick="openAuthModal()" id="adminBtn">👤</div>

<!-- SETTINGS -->
<div class="settings-btn" onclick="toggleSettings()">⚙️</div>

<div class="settings" id="settings">
    <div class="lang" onclick="setLang('de')">🇩🇪 Deutsch</div>
    <div class="lang" onclick="setLang('en')">🇬🇧 English</div>
    <div class="lang" onclick="setLang('ru')">🇷🇺 Русский</div>
    <div class="lang" onclick="setLang('pl')">🇵🇱 Polski</div>
</div>

<!-- HEADER -->
<div class="header">
    <h1 id="title">VIBES CLUB</h1>
</div>

<!-- TABS -->
<div class="tabs" id="tabsContainer">
    <div class="tab active" onclick="openTab(event,'cocktails')" id="t1" data-text="cocktails">Cocktails</div>
    <div class="tab" onclick="openTab(event,'longdrinks')" id="t2" data-text="longdrinks">Longdrinks</div>
    <div class="tab" onclick="openTab(event,'likor')" id="t3" data-text="likor">Liköre</div>
    <div class="tab" onclick="openTab(event,'shots')" id="t4" data-text="shots">Shots</div>
    <div class="tab" onclick="openTab(event,'flaschen')" id="t5" data-text="flaschen">Flaschen</div>
</div>

<!-- MENUS -->
<div id="cocktails" class="menu active"></div>
<div id="longdrinks" class="menu"></div>
<div id="likor" class="menu"></div>
<div id="shots" class="menu"></div>
<div id="flaschen" class="menu"></div>

<!-- ADD DRINK BUTTON -->
<div class="add-drink-container">
    <button class="btn-add-drink" onclick="openAddDrinkModal()">+ Добавить напиток</button>
</div>

<!-- FOOTER -->
<div class="footer">
    <div>VIBES CLUB</div>
    <div class="address" data-text="address">Schachtweg 34, 38440 Wolfsburg</div>
</div>

<!-- AUTH MODAL -->
<div id="authModal" class="modal">
    <div class="modal-content">
        <!-- КРЕСТИК ТУТ -->
        <button class="close-modal-btn" onclick="closeAuthModal()">✕</button>
        
        <h2 id="authTitle">Admin Login</h2>
        <form class="auth-form" onsubmit="handleAuth(event)" id="authFormElement">
            <div class="form-group">
                <label for="authEmail">Email:</label>
                <input type="email" id="authEmail" required>
            </div>
            <div class="form-group">
                <label for="authPassword">Password:</label>
                <input type="password" id="authPassword" required>
            </div>
            <div id="authError" class="error"></div>
            <div class="modal-buttons">
                <button type="button" class="btn-cancel" onclick="closeAuthModal()">Cancel</button>
                <button type="submit" class="btn-save">Login</button>
            </div>
        </form>
        <div id="userPanel" style="display:none;">
            <div class="user-info">
                <div>Logged in as: <strong id="userEmail"></strong></div>
            </div>
            <button class="admin-panel-btn" id="editModeBtn" onclick="toggleAdminMode()">Edit Mode</button>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </div>
</div>

<!-- ADD/EDIT DRINK MODAL -->
<div id="drinkModal" class="modal">
    <div class="modal-content">
        <!-- И ТУТ КРЕСТИК -->
        <button class="close-modal-btn" onclick="closeDrinkModal()">✕</button>
        
        <h2 id="drinkModalTitle">Add Drink</h2>
        <form onsubmit="saveDrink(event)">
            <div class="form-group">
                <label for="drinkCategory">Category:</label>
                <select id="drinkCategory" required>
                    <option value="cocktails">Cocktails</option>
                    <option value="longdrinks">Longdrinks</option>
                    <option value="likor">Liköre</option>
                    <option value="shots">Shots</option>
                    <option value="flaschen">Flaschen</option>
                </select>
            </div>
            <div class="form-group">
                <label for="drinkName">Name:</label>
                <input type="text" id="drinkName" required>
            </div>
            <div class="form-group">
                <label for="drinkPrice">Price:</label>
                <input type="text" id="drinkPrice" placeholder="8,50€" required>
            </div>
            <div class="form-group">
                <label for="drinkInfo">Composition/Description:</label>
                <textarea id="drinkInfo" required></textarea>
            </div>
            <div id="drinkError" class="error"></div>
            <div class="modal-buttons">
                <button type="button" class="btn-cancel" onclick="closeDrinkModal()">Cancel</button>
                <button type="submit" class="btn-save">Save</button>
            </div>
        </form>
    </div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
// FIREBASE CONFIG
const firebaseConfig = {
    apiKey: "AIzaSyDUMC5sE5zHZ2mQRlvQXkKaFQqM27sE5Jk",
    authDomain: "vibesclub-5ffea.firebaseapp.com",
    projectId: "Vibesclub-5FFEA",
    storageBucket: "vibesclub-5ffea.firebasestorage.app",
    messagingSenderId: "59804733253",
    appId: "1:59804733253:web:a71cff5b6f41b5546c382c",
    measurementId: "G-QEVXE3G5GN"
};

// Initialize Firebase
const app = firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
let currentLang = localStorage.getItem("lang") || "de";
let adminMode = false;
let editingDrinkId = null;

const translations = {
    de: { title: "VIBES CLUB", cocktails: "Cocktails", longdrinks: "Longdrinks", likor: "Liköre", shots: "Shots", flaschen: "Flaschen", address: "Schachtweg 34, 38440 Wolfsburg" },
    en: { title: "VIBES CLUB", cocktails: "Cocktails", longdrinks: "Longdrinks", likor: "Liqueurs", shots: "Shots", flaschen: "Bottles", address: "Schachtweg 34, 38440 Wolfsburg" },
    ru: { title: "VIBES CLUB", cocktails: "Коктейли", longdrinks: "Лонгдринки", likor: "Ликёры", shots: "Шоты", flaschen: "Бутылки", address: "Schachtweg 34, 38440 Wolfsburg" },
    pl: { title: "VIBES CLUB", cocktails: "Koktajle", longdrinks: "Drinki długie", likor: "Likier", shots: "Shotki", flaschen: "Butelki", address: "Schachtweg 34, 38440 Wolfsburg" }
};

function toggleSettings(){
    document.getElementById("settings").classList.toggle("active");
}

function openTab(event, tab){
    document.querySelectorAll(".menu").forEach(m=>m.classList.remove("active"));
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    document.getElementById(tab).classList.add("active");
    event.target.classList.add("active");
}

function toggleDrink(el){
    el.classList.toggle("active");
}

function setLang(lang){
    currentLang = lang;
    localStorage.setItem("lang", lang);
    document.documentElement.lang = lang;
    document.getElementById("settings").classList.remove("active");
    
    document.querySelectorAll("[data-text]").forEach(el => {
        const key = el.getAttribute("data-text");
        if(translations[lang][key]) {
            el.textContent = translations[lang][key];
        }
    });
    document.getElementById("title").textContent = translations[lang].title;
}

function openAuthModal(){
    document.getElementById("authModal").classList.add("active");
}

function closeAuthModal(){
    document.getElementById("authModal").classList.remove("active");
    document.getElementById("authError").textContent = "";
}

async function handleAuth(event){
    event.preventDefault();
    const email = document.getElementById("authEmail").value;
    const password = document.getElementById("authPassword").value;
    
    try {
        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        currentUser = userCredential.user;
        showUserPanel();
        closeAuthModal(); 
    } catch (error) {
        document.getElementById("authError").textContent = "Error: " + error.message;
    }
}

function showUserPanel(){
    document.getElementById("authFormElement").style.display = "none";
    document.getElementById("userPanel").style.display = "block";
    document.getElementById("userEmail").textContent = currentUser.email;
    document.getElementById("adminBtn").classList.add("logged-in");
}

async function logout(){
    await auth.signOut();
    currentUser = null;
    adminMode = false;
    document.getElementById("authFormElement").style.display = "block";
    document.getElementById("userPanel").style.display = "none";
    document.getElementById("adminBtn").classList.remove("logged-in");
    toggleAdminUI(false);
    closeAuthModal();
}

function toggleAdminMode(){
    adminMode = !adminMode;
    toggleAdminUI(adminMode);
    closeAuthModal(); 
}

function toggleAdminUI(enable){
    const button = document.querySelector(".btn-add-drink");
    const drinks = document.querySelectorAll(".drink");
    const editModeBtn = document.getElementById("editModeBtn");
    
    if(enable) {
        button.classList.add("admin-mode");
        drinks.forEach(d => d.classList.add("admin-mode"));
        if(editModeBtn) editModeBtn.textContent = "Exit Edit Mode";
    } else {
        button.classList.remove("admin-mode");
        drinks.forEach(d => d.classList.remove("admin-mode"));
        if(editModeBtn) editModeBtn.textContent = "Edit Mode";
    }
}

function openAddDrinkModal(){
    editingDrinkId = null;
    document.getElementById("drinkModalTitle").textContent = "Add Drink";
    document.getElementById("drinkCategory").value = "cocktails";
    document.getElementById("drinkName").value = "";
    document.getElementById("drinkPrice").value = "";
    document.getElementById("drinkInfo").value = "";
    document.getElementById("drinkError").textContent = "";
    document.getElementById("drinkModal").classList.add("active");
}

function closeDrinkModal(){
    document.getElementById("drinkModal").classList.remove("active");
}

async function saveDrink(event){
    event.preventDefault();
    const category = document.getElementById("drinkCategory").value;
    const name = document.getElementById("drinkName").value;
    const price = document.getElementById("drinkPrice").value;
    const info = document.getElementById("drinkInfo").value;
    
    try {
        if(editingDrinkId) {
            await db.collection("drinks").doc(editingDrinkId).update({ name, price, info, category });
        } else {
            await db.collection("drinks").add({ name, price, info, category, createdAt: new Date() });
        }
        loadDrinks();
        closeDrinkModal();
    } catch (error) {
        document.getElementById("drinkError").textContent = "Error: " + error.message;
    }
}

async function deleteDrink(drinkId){
    if(confirm("Delete this drink?")) {
        try {
            await db.collection("drinks").doc(drinkId).delete();
            loadDrinks();
        } catch (error) {
            alert("Error: " + error.message);
        }
    }
}

function editDrink(drinkId, drink){
    editingDrinkId = drinkId;
    document.getElementById("drinkModalTitle").textContent = "Edit Drink";
    document.getElementById("drinkCategory").value = drink.category;
    document.getElementById("drinkName").value = drink.name;
    document.getElementById("drinkPrice").value = drink.price;
    document.getElementById("drinkInfo").value = drink.info;
    document.getElementById("drinkError").textContent = "";
    document.getElementById("drinkModal").classList.add("active");
}

async function loadDrinks(){
    try {
        document.getElementById("cocktails").innerHTML = "";
        document.getElementById("longdrinks").innerHTML = "";
        document.getElementById("likor").innerHTML = "";
        document.getElementById("shots").innerHTML = "";
        document.getElementById("flaschen").innerHTML = "";
        
        const querySnapshot = await db.collection("drinks").get();
        
        querySnapshot.forEach((doc) => {
            const drink = doc.data();
            const drinkId = doc.id;
            const menu = document.getElementById(drink.category);
            
            const drinkEl = document.createElement("div");
            drinkEl.className = "drink" + (adminMode ? " admin-mode" : "");
            drinkEl.innerHTML = `
                <div class="drink-header" onclick="if(!event.target.closest('.drink-actions')) toggleDrink(this.parentElement)">
                    <span>${drink.name}</span>
                    <span class="price">${drink.price}</span>
                    <div class="drink-actions">
                        <button type="button" onclick="editDrink('${drinkId}', ${JSON.stringify(drink).replace(/'/g, "&apos;")})">✏️</button>
                        <button type="button" class="delete-btn" onclick="deleteDrink('${drinkId}')">🗑️</button>
                    </div>
                </div>
                <div class="drink-info">${drink.info}</div>
            `;
            menu.appendChild(drinkEl);
        });
    } catch (error) {
        console.error("Error loading drinks:", error);
    }
}

auth.onAuthStateChanged((user) => {
    if (user) {
        currentUser = user;
        showUserPanel();
        document.getElementById("adminBtn").classList.add("logged-in");
    }
});

document.addEventListener("DOMContentLoaded", function() {
    setLang(currentLang);
    loadDrinks();
});
</script>

</body>
</html>
