
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIBES CLUB</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
}

/* HEADER */
.header{
    text-align:center;
    padding:25px;
    background:#1a1a1a;
    border-bottom:1px solid #333;
}

.header h1{
    font-size:30px;
    letter-spacing:3px;
}

/* SETTINGS */
.settings-btn{
    position: absolute;
    top:15px;
    right:15px;
    width:50px;
    height:50px;
    background:#222;
    border-radius:12px;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    font-size:24px;
    z-index:99999;
}

.settings{
    position:fixed;
    top:75px;
    right:15px;
    width:180px;
    background:#1e1e1e;
    border-radius:12px;
    overflow:hidden;
    display:none;
    z-index:99999;
}

.settings.active{
    display:block;
}

.lang{
    padding:12px;
    cursor:pointer;
}

.lang:hover{
    background:#333;
}

/* TABS */
.tabs{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    padding:15px;
}

.tab{
    background:#222;
    padding:10px 16px;
    border-radius:10px;
    cursor:pointer;
}

.tab.active{
    background:red;
}

/* MENU */
.menu{
    display:none;
    max-width:800px;
    margin:auto;
    padding:15px;
}

.menu.active{
    display:block;
}

.item{
    display:flex;
    justify-content:space-between;
    background:#1e1e1e;
    padding:15px;
    margin-bottom:10px;
    border-radius:10px;
}

.price{
    color:red;
    font-weight:bold;
}

/* FOOTER */
.footer{
    text-align:center;
    padding:30px;
    color:#999;
}

.age{
    color:red;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="settings-btn" onclick="toggleSettings()">⚙️</div>

<div class="settings" id="settings">
    <div class="lang" onclick="setLang('de')">🇩🇪 Deutsch</div>
    <div class="lang" onclick="setLang('en')">🇬🇧 English</div>
    <div class="lang" onclick="setLang('ru')">🇷🇺 Русский</div>
    <div class="lang" onclick="setLang('pl')">🇵🇱 Polski</div>
</div>

<div class="header">
    <h1 id="title">VIBES CLUB</h1>
</div>

<div class="tabs">
    <div id="tab-cocktails" class="tab active" onclick="openTab(event,'cocktails')">Cocktails</div>
    <div id="tab-longdrinks" class="tab" onclick="openTab(event,'longdrinks')">Longdrinks</div>
    <div id="tab-likor" class="tab" onclick="openTab(event,'likor')">Liköre</div>
    <div id="tab-shots" class="tab" onclick="openTab(event,'shots')">Shots</div>
    <div id="tab-flaschen" class="tab" onclick="openTab(event,'flaschen')">Flaschen</div>
</div>

<div id="cocktails" class="menu active">
</div>

<div id="longdrinks" class="menu">
</div>

<div id="likor" class="menu">
</div>

<div id="shots" class="menu">
</div>

<div id="flaschen" class="menu">
</div>

<div class="footer">
    <div class="age">18+</div>
    <div>VIBES CLUB</div>
</div>

<script>
function toggleSettings(){
    document.getElementById("settings").classList.toggle("active");
}

function openTab(event, tab){

    document.querySelectorAll(".menu").forEach(menu=>{
        menu.classList.remove("active");
    });

    document.querySelectorAll(".tab").forEach(btn=>{
        btn.classList.remove("active");
    });

    document.getElementById(tab).classList.add("active");
    event.target.classList.add("active");
}

function setLang(lang){

    const text = {

        de:{
            cocktails:"Cocktails",
            longdrinks:"Longdrinks",
            likor:"Liköre",
            shots:"Shots",
            flaschen:"Flaschen"
        },

        en:{
            cocktails:"Cocktails",
            longdrinks:"Long Drinks",
            likor:"Liqueurs",
            shots:"Shots",
            flaschen:"Bottles"
        },

        ru:{
            cocktails:"Коктейли",
            longdrinks:"Лонгдринки",
            likor:"Ликёры",
            shots:"Шоты",
            flaschen:"Бутылки"
        },

        pl:{
            cocktails:"Koktajle",
            longdrinks:"Long Drinki",
            likor:"Likiery",
            shots:"Shoty",
            flaschen:"Butelki"
        }
    };

    document.getElementById("tab-cocktails").innerText = text[lang].cocktails;
    document.getElementById("tab-longdrinks").innerText = text[lang].longdrinks;
    document.getElementById("tab-likor").innerText = text[lang].likor;
    document.getElementById("tab-shots").innerText = text[lang].shots;
    document.getElementById("tab-flaschen").innerText = text[lang].flaschen;

    document.getElementById("settings").classList.remove("active");
}
</script>

</body>
</html>
```
