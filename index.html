<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIBES CLUB</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#111;
    color:#fff;
}

/* HEADER */
.header{
    text-align:center;
    padding:20px;
    background:#1a1a1a;
    border-bottom:1px solid #333;
}

.header h1{
    margin:0;
    font-size:28px;
}

/* SETTINGS */
.settings-btn{
    position:absolute;
    top:15px;
    right:15px;
    width:50px;
    height:50px;
    background:#222;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:22px;
}

.settings{
    position:absolute;
    top:75px;
    right:15px;
    width:180px;
    background:#1e1e1e;
    border-radius:12px;
    display:none;
}

.settings.active{
    display:block;
}

.lang{
    padding:12px;
    cursor:pointer;
}

.lang:hover{
    background:#333;
}

/* TABS */
.tabs{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    padding:15px;
}

.tab{
    background:#222;
    padding:10px 16px;
    border-radius:10px;
    cursor:pointer;
}

.tab.active{
    background:red;
}

/* MENU */
.menu{
    display:none;
    max-width:800px;
    margin:auto;
    padding:15px;
}

.menu.active{
    display:block;
}

/* DRINK */
.drink{
    background:#1e1e1e;
    border-radius:12px;
    margin-bottom:10px;
    cursor:pointer;
    overflow:hidden;
}

.drink-header{
    display:flex;
    justify-content:space-between;
    padding:15px;
}

.drink-header:hover{
    background:#2a2a2a;
}

.drink-info{
    display:none;
    padding:15px;
    border-top:1px solid #333;
    color:#ccc;
}

.drink.active .drink-info{
    display:block;
}

.price{
    color:red;
    font-weight:bold;
}

/* FOOTER */
.footer{
    text-align:center;
    padding:25px;
    color:#aaa;
    border-top:1px solid #333;
    margin-top:20px;
}

.address{
    margin-top:8px;
    color:#fff;
    font-size:14px;
}
</style>
</head>

<body>

<!-- SETTINGS -->
<div class="settings-btn" onclick="toggleSettings()">⚙️</div>

<div class="settings" id="settings">
    <div class="lang" onclick="setLang('de')">🇩🇪 Deutsch</div>
    <div class="lang" onclick="setLang('en')">🇬🇧 English</div>
    <div class="lang" onclick="setLang('ru')">🇷🇺 Русский</div>
    <div class="lang" onclick="setLang('pl')">🇵🇱 Polski</div>
</div>

<!-- HEADER -->
<div class="header">
    <h1 id="title">VIBES CLUB</h1>
</div>

<!-- TABS -->
<div class="tabs">
    <div class="tab active" onclick="openTab(event,'cocktails')" id="t1" data-text="cocktails">Cocktails</div>
    <div class="tab" onclick="openTab(event,'longdrinks')" id="t2" data-text="longdrinks">Longdrinks</div>
    <div class="tab" onclick="openTab(event,'likor')" id="t3" data-text="likor">Liköre</div>
    <div class="tab" onclick="openTab(event,'shots')" id="t4" data-text="shots">Shots</div>
    <div class="tab" onclick="openTab(event,'flaschen')" id="t5" data-text="flaschen">Flaschen</div>
</div>

<!-- COCKTAILS -->
<div id="cocktails" class="menu active">

    <div class="drink" onclick="toggleDrink(this)">
        <div class="drink-header">
            <span data-text="mojito">Mojito</span>
            <span class="price">8,50€</span>
        </div>
        <div class="drink-info" data-text="mojito_info">
            Rum 50ml<br>
            Lime<br>
            Mint<br>
            Soda<br><br>
            300ml
        </div>
    </div>

</div>

<div id="longdrinks" class="menu"></div>
<div id="likor" class="menu"></div>
<div id="shots" class="menu"></div>
<div id="flaschen" class="menu"></div>

<!-- FOOTER -->
<div class="footer">
    <div>VIBES CLUB</div>
    <div class="address" data-text="address">Schachtweg 34, 38440 Wolfsburg</div>
</div>

<script>
// СЛОВАРЬ ПЕРЕВОДОВ
const translations = {
    de: {
        title: "VIBES CLUB",
        cocktails: "Cocktails",
        longdrinks: "Longdrinks",
        likor: "Liköre",
        shots: "Shots",
        flaschen: "Flaschen",
        mojito: "Mojito",
        mojito_info: "Rum 50ml<br>Lime<br>Mint<br>Soda<br><br>300ml",
        address: "Schachtweg 34, 38440 Wolfsburg"
    },
    en: {
        title: "VIBES CLUB",
        cocktails: "Cocktails",
        longdrinks: "Longdrinks",
        likor: "Liqueurs",
        shots: "Shots",
        flaschen: "Bottles",
        mojito: "Mojito",
        mojito_info: "Rum 50ml<br>Lime<br>Mint<br>Soda<br><br>300ml",
        address: "Schachtweg 34, 38440 Wolfsburg"
    },
    ru: {
        title: "VIBES CLUB",
        cocktails: "Коктейли",
        longdrinks: "Лонгдринки",
        likor: "Ликёры",
        shots: "Шоты",
        flaschen: "Бутылки",
        mojito: "Мохито",
        mojito_info: "Ром 50мл<br>Лайм<br>Мята<br>Сода<br><br>300мл",
        address: "Schachtweg 34, 38440 Wolfsburg"
    },
    pl: {
        title: "VIBES CLUB",
        cocktails: "Koktajle",
        longdrinks: "Drinki długie",
        likor: "Likier",
        shots: "Shotki",
        flaschen: "Butelki",
        mojito: "Mojito",
        mojito_info: "Rum 50ml<br>Lime<br>Mięta<br>Soda<br><br>300ml",
        address: "Schachtweg 34, 38440 Wolfsburg"
    }
};

let currentLang = localStorage.getItem("lang") || "de";

function toggleSettings(){
    document.getElementById("settings").classList.toggle("active");
}

function openTab(event, tab){
    document.querySelectorAll(".menu").forEach(m=>m.classList.remove("active"));
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));

    document.getElementById(tab).classList.add("active");
    event.target.classList.add("active");
}

function toggleDrink(el){
    el.classList.toggle("active");
}

function setLang(lang){
    currentLang = lang;
    localStorage.setItem("lang", lang);
    document.documentElement.lang = lang;
    document.getElementById("settings").classList.remove("active");
    
    // Обновляем все элементы с атрибутом data-text
    document.querySelectorAll("[data-text]").forEach(el => {
        const key = el.getAttribute("data-text");
        if(translations[lang][key]) {
            el.innerHTML = translations[lang][key];
        }
    });
    
    // Обновляем заголовок
    document.getElementById("title").textContent = translations[lang].title;
}

// Инициализация при загрузке страницы
document.addEventListener("DOMContentLoaded", function() {
    setLang(currentLang);
});
</script>

</body>
</html>
