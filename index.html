<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIBES CLUB</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#111;
    color:#fff;
}

/* HEADER */
.header{
    text-align:center;
    padding:20px;
    background:#1a1a1a;
    border-bottom:1px solid #333;
    position:relative;
}

.header h1{
    margin:0;
    font-size:28px;
}

/* SETTINGS */
.settings-btn{
    position:absolute;
    top:15px;
    right:15px;
    width:50px;
    height:50px;
    background:#222;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:22px;
}

.admin-btn{
    position:absolute;
    top:15px;
    left:15px;
    width:50px;
    height:50px;
    background:#222;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:22px;
}

.admin-btn.logged-in{
    background:#ff4444;
}

.settings{
    position:absolute;
    top:75px;
    right:15px;
    width:180px;
    background:#1e1e1e;
    border-radius:12px;
    display:none;
    z-index:100;
}

.settings.active{
    display:block;
}

.lang{
    padding:12px;
    cursor:pointer;
}

.lang:hover{
    background:#333;
}

/* TABS */
.tabs{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    padding:15px;
}

.tab{
    background:#222;
    padding:10px 16px;
    border-radius:10px;
    cursor:pointer;
}

.tab.active{
    background:red;
}

/* MENU */
.menu{
    display:none;
    max-width:800px;
    margin:auto;
    padding:15px;
}

.menu.active{
    display:block;
}

/* DRINK */
.drink{
    background:#1e1e1e;
    border-radius:12px;
    margin-bottom:10px;
    cursor:pointer;
    overflow:hidden;
    position:relative;
}

.drink-header{
    display:flex;
    justify-content:space-between;
    padding:15px;
    align-items:center;
}

.drink-header:hover{
    background:#2a2a2a;
}

.drink-actions{
    display:none;
    gap:8px;
}

.drink.admin-mode .drink-actions{
    display:flex;
}

.drink-actions button{
    background:#444;
    border:none;
    color:#fff;
    padding:5px 10px;
    border-radius:5px;
    cursor:pointer;
    font-size:12px;
}

.drink-actions button:hover{
    background:#666;
}

.drink-actions .delete-btn{
    background:#cc0000;
}

.drink-actions .delete-btn:hover{
    background:#ff0000;
}

.drink-info{
    display:none;
    padding:15px;
    border-top:1px solid #333;
    color:#ccc;
}

.drink.active .drink-info{
    display:block;
}

.price{
    color:red;
    font-weight:bold;
}

/* FOOTER */
.footer{
    text-align:center;
    padding:25px;
    color:#aaa;
    border-top:1px solid #333;
    margin-top:20px;
}

.address{
    margin-top:8px;
    color:#fff;
    font-size:14px;
}

/* MODAL */
.modal{
    display:none;
    position:fixed;
    z-index:1000;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background-color:rgba(0,0,0,0.7);
}

.modal.active{
    display:flex;
    align-items:center;
    justify-content:center;
}

.modal-content{
    background:#1e1e1e;
    padding:30px;
    border-radius:15px;
    max-width:500px;
    width:90%;
    border:1px solid #333;
}

.modal-content h2{
    margin-top:0;
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    padding:10px;
    border:1px solid #444;
    border-radius:5px;
    background:#222;
    color:#fff;
    box-sizing:border-box;
}

.form-group textarea{
    resize:vertical;
    min-height:80px;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
    outline:none;
    border-color:#ff0000;
}

.modal-buttons{
    display:flex;
    gap:10px;
    justify-content:flex-end;
}

.modal-buttons button{
    padding:10px 20px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-weight:bold;
}

.btn-save{
    background:#ff0000;
    color:#fff;
}

.btn-save:hover{
    background:#cc0000;
}

.btn-cancel{
    background:#444;
    color:#fff;
}

.btn-cancel:hover{
    background:#555;
}

.btn-add-drink{
    background:#ff0000;
    color:#fff;
    padding:10px 20px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    margin-top:15px;
    display:none;
}

.btn-add-drink.admin-mode{
    display:block;
}

.btn-add-drink:hover{
    background:#cc0000;
}

/* AUTH MODAL */
.auth-form{
    text-align:center;
}

.auth-form .form-group{
    text-align:left;
}

.error{
    color:#ff4444;
    font-size:12px;
    margin-top:5px;
}

.success{
    color:#44ff44;
    font-size:12px;
    margin-top:5px;
}

.admin-panel-btn{
    background:#ff0000;
    color:#fff;
    padding:10px 20px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    margin-top:10px;
    width:100%;
}

.admin-panel-btn:hover{
    background:#cc0000;
}

.logout-btn{
    background:#cc0000;
    color:#fff;
    padding:10px 20px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    margin-top:10px;
    width:100%;
}

.logout-btn:hover{
    background:#990000;
}

.user-info{
    padding:15px;
    background:#222;
    border-radius:5px;
    margin-bottom:15px;
    font-size:14px;
}
</style>
</head>

<body>

<!-- ADMIN BUTTON -->
<div class="admin-btn" onclick="openAuthModal()" id="adminBtn">👤</div>

<!-- SETTINGS -->
<div class="settings-btn" onclick="toggleSettings()">⚙️</div>

<div class="settings" id="settings">
    <div class="lang" onclick="setLang('de')">🇩🇪 Deutsch</div>
    <div class="lang" onclick="setLang('en')">🇬🇧 English</div>
    <div class="lang" onclick="setLang('ru')">🇷🇺 Русский</div>
    <div class="lang" onclick="setLang('pl')">🇵🇱 Polski</div>
</div>

<!-- HEADER -->
<div class="header">
    <h1 id="title">VIBES CLUB</h1>
</div>

<!-- TABS -->
<div class="tabs" id="tabsContainer">
    <div class="tab active" onclick="openTab(event,'cocktails')" id="t1" data-text="cocktails">Cocktails</div>
    <div class="tab" onclick="openTab(event,'longdrinks')" id="t2" data-text="longdrinks">Longdrinks</div>
    <div class="tab" onclick="openTab(event,'likor')" id="t3" data-text="likor">Liköre</div>
    <div class="tab" onclick="openTab(event,'shots')" id="t4" data-text="shots">Shots</div>
    <div class="tab" onclick="openTab(event,'flaschen')" id="t5" data-text="flaschen">Flaschen</div>
</div>

<!-- MENUS -->
<div id="cocktails" class="menu active"></div>
<div id="longdrinks" class="menu"></div>
<div id="likor" class="menu"></div>
<div id="shots" class="menu"></div>
<div id="flaschen" class="menu"></div>

<!-- ADD DRINK BUTTON -->
<div style="text-align:center; padding:15px;">
    <button class="btn-add-drink" onclick="openAddDrinkModal()">+ Добавить напиток</button>
</div>

<!-- FOOTER -->
<div class="footer">
    <div>VIBES CLUB</div>
    <div class="address" data-text="address">Schachtweg 34, 38440 Wolfsburg</div>
</div>

<!-- AUTH MODAL -->
<div id="authModal" class="modal">
    <div class="modal-content">
        <h2 id="authTitle">Вход администратора</h2>
        <form class="auth-form" onsubmit="handleAuth(event)">
            <div class="form-group">
                <label for="authEmail" data-text="email">Email:</label>
                <input type="email" id="authEmail" required>
                <div id="emailError" class="error"></div>
            </div>
            <div class="form-group">
                <label for="authPassword" data-text="password">Пароль:</label>
                <input type="password" id="authPassword" required>
                <div id="passwordError" class="error"></div>
            </div>
            <div id="authError" class="error"></div>
            <div class="modal-buttons">
                <button type="button" class="btn-cancel" onclick="closeAuthModal()">Отмена</button>
                <button type="submit" class="btn-save">Вход</button>
            </div>
        </form>
        <div id="userPanel" style="display:none;">
            <div class="user-info">
                <div>Вошли как: <strong id="userEmail"></strong></div>
            </div>
            <button class="admin-panel-btn" onclick="goToAdminPanel()">Панель управления</button>
            <button class="logout-btn" onclick="logout()">Выход</button>
        </div>
    </div>
</div>

<!-- ADD/EDIT DRINK MODAL -->
<div id="drinkModal" class="modal">
    <div class="modal-content">
        <h2 id="drinkModalTitle">Добавить напиток</h2>
        <form onsubmit="saveDrink(event)">
            <div class="form-group">
                <label for="drinkCategory">Категория:</label>
                <select id="drinkCategory" required>
                    <option value="cocktails">Cocktails</option>
                    <option value="longdrinks">Longdrinks</option>
                    <option value="likor">Liköre</option>
                    <option value="shots">Shots</option>
                    <option value="flaschen">Flaschen</option>
                </select>
            </div>
            <div class="form-group">
                <label for="drinkName">Название:</label>
                <input type="text" id="drinkName" required>
            </div>
            <div class="form-group">
                <label for="drinkPrice">Цена:</label>
                <input type="text" id="drinkPrice" placeholder="8,50€" required>
            </div>
            <div class="form-group">
                <label for="drinkInfo">Состав/Описание:</label>
                <textarea id="drinkInfo" required></textarea>
            </div>
            <div class="modal-buttons">
                <button type="button" class="btn-cancel" onclick="closeDrinkModal()">Отмена</button>
                <button type="submit" class="btn-save">Сохранить</button>
            </div>
        </form>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js"></script>

function toggleSettings(){
    document.getElementById("settings").classList.toggle("active");
}

function openTab(event, tab){
    document.querySelectorAll(".menu").forEach(m=>m.classList.remove("active"));
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    document.getElementById(tab).classList.add("active");
    event.target.classList.add("active");
}

function toggleDrink(el){
    el.classList.toggle("active");
}

function setLang(lang){
    currentLang = lang;
    localStorage.setItem("lang", lang);
    document.documentElement.lang = lang;
    document.getElementById("settings").classList.remove("active");
    
    document.querySelectorAll("[data-text]").forEach(el => {
        const key = el.getAttribute("data-text");
        if(translations[lang][key]) {
            if(el.tagName === "TEXTAREA" || el.tagName === "INPUT") {
                el.placeholder = translations[lang][key];
            } else {
                el.textContent = translations[lang][key];
            }
        }
    });
    
    document.getElementById("title").textContent = translations[lang].title;
}

function openAuthModal(){
    document.getElementById("authModal").classList.add("active");
}

function closeAuthModal(){
    document.getElementById("authModal").classList.remove("active");
    document.getElementById("authError").textContent = "";
}

function handleAuth(event){
    event.preventDefault();
    // Логика аутентификации будет добавлена после создания Firebase проекта
    alert("Пожалуйста, сначала создайте Firebase проект и добавьте конфиг");
}

function logout(){
    currentUser = null;
    adminMode = false;
    document.getElementById("adminBtn").classList.remove("logged-in");
    document.querySelectorAll(".menu").forEach(m => m.classList.remove("admin-mode"));
    document.querySelectorAll(".drink").forEach(d => d.classList.remove("admin-mode"));
    document.querySelectorAll(".btn-add-drink").forEach(b => b.classList.remove("admin-mode"));
    closeAuthModal();
}

function openAddDrinkModal(){
    editingDrinkId = null;
    document.getElementById("drinkModalTitle").textContent = "Добавить напиток";
    document.getElementById("drinkCategory").value = "cocktails";
    document.getElementById("drinkName").value = "";
    document.getElementById("drinkPrice").value = "";
    document.getElementById("drinkInfo").value = "";
    document.getElementById("drinkModal").classList.add("active");
}

function closeDrinkModal(){
    document.getElementById("drinkModal").classList.remove("active");
}

function saveDrink(event){
    event.preventDefault();
    alert("Функция добавления напитков будет работать после подключения Firebase");
}

function goToAdminPanel(){

}

function editDrink(drinkId, drink, category){
    editingDrinkId = drinkId;
    document.getElementById("drinkModalTitle").textContent = "Редактировать напиток";
    document.getElementById("drinkCategory").value = category;
    document.getElementById("drinkName").value = drink.name;
    document.getElementById("drinkPrice").value = drink.price;
    document.getElementById("drinkInfo").value = drink.info;
    document.getElementById("drinkModal").classList.add("active");
}

document.addEventListener("DOMContentLoaded", function() {
    setLang(currentLang);
    loadDrinks();
});
</script>

</html>
