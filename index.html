```html
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIBES CLUB</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111;
    color:#fff;
}

/* HEADER */
.header{
    text-align:center;
    padding:20px;
    background:#1a1a1a;
    border-bottom:1px solid #333;
}

.header h1{
    margin:0;
    font-size:28px;
    letter-spacing:2px;
}

/* SETTINGS BUTTON */
.settings-btn{
    position:absolute; /* ДВИГАЕТСЯ С САЙТОМ */
    top:15px;
    right:15px;

    width:50px;
    height:50px;

    background:#222;
    border-radius:12px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;
    font-size:22px;
}

/* SETTINGS MENU */
.settings{
    position:absolute;
    top:70px;
    right:15px;

    width:180px;
    background:#1e1e1e;
    border-radius:12px;

    display:none;
}

.settings.active{
    display:block;
}

.lang{
    padding:12px;
    cursor:pointer;
}

.lang:hover{
    background:#333;
}

/* TABS */
.tabs{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    padding:15px;
}

.tab{
    background:#222;
    padding:10px 16px;
    border-radius:10px;
    cursor:pointer;
}

.tab.active{
    background:red;
}

/* MENU */
.menu{
    display:none;
    max-width:800px;
    margin:auto;
    padding:15px;
}

.menu.active{
    display:block;
}

/* DRINK CARD */
.drink{
    background:#1e1e1e;
    border-radius:12px;
    margin-bottom:10px;
    overflow:hidden;
    cursor:pointer;
}

.drink-header{
    display:flex;
    justify-content:space-between;
    padding:15px;
}

.drink-header:hover{
    background:#2a2a2a;
}

.drink-info{
    display:none;
    padding:15px;
    border-top:1px solid #333;
    color:#ccc;
}

.drink.active .drink-info{
    display:block;
}

.price{
    color:red;
    font-weight:bold;
}

/* FOOTER */
.footer{
    text-align:center;
    padding:20px;
    color:#aaa;
}

.age{
    color:red;
    font-weight:bold;
}
</style>
</head>

<body>

<!-- SETTINGS BUTTON -->
<div class="settings-btn" onclick="toggleSettings()">⚙️</div>

<!-- SETTINGS MENU -->
<div class="settings" id="settings">
    <div class="lang" onclick="setLang('de')">🇩🇪 Deutsch</div>
    <div class="lang" onclick="setLang('en')">🇬🇧 English</div>
    <div class="lang" onclick="setLang('ru')">🇷🇺 Русский</div>
    <div class="lang" onclick="setLang('pl')">🇵🇱 Polski</div>
</div>

<!-- HEADER -->
<div class="header">
    <h1>VIBES CLUB</h1>
</div>

<!-- TABS -->
<div class="tabs">
    <div class="tab active" onclick="openTab(event,'cocktails')">Cocktails</div>
    <div class="tab" onclick="openTab(event,'longdrinks')">Longdrinks</div>
    <div class="tab" onclick="openTab(event,'likor')">Liköre</div>
    <div class="tab" onclick="openTab(event,'shots')">Shots</div>
    <div class="tab" onclick="openTab(event,'flaschen')">Flaschen</div>
</div>

<!-- COCKTAILS -->
<div id="cocktails" class="menu active">

    <div class="drink" onclick="toggleDrink(this)">
        <div class="drink-header">
            <span>Mojito</span>
            <span class="price">8,50€</span>
        </div>
        <div class="drink-info">
            Состав:<br>
            Добавь сюда ингредиенты<br><br>
            Объём: 300 мл
        </div>
    </div>

</div>

<!-- LONGDRINKS -->
<div id="longdrinks" class="menu"></div>

<!-- LIKÖRE -->
<div id="likor" class="menu"></div>

<!-- SHOTS -->
<div id="shots" class="menu"></div>

<!-- FLASCHEN -->
<div id="flaschen" class="menu"></div>

<!-- FOOTER -->
<div class="footer">
    <div class="age">18+</div>
    VIBES CLUB
</div>

<script>
function toggleSettings(){
    document.getElementById("settings").classList.toggle("active");
}

function openTab(event, tab){

    document.querySelectorAll(".menu").forEach(m=>{
        m.classList.remove("active");
    });

    document.querySelectorAll(".tab").forEach(t=>{
        t.classList.remove("active");
    });

    document.getElementById(tab).classList.add("active");
    event.target.classList.add("active");
}

function toggleDrink(el){
    el.classList.toggle("active");
}

function setLang(lang){
    document.getElementById("settings").classList.remove("active");
}
</script>

</body>
</html>
```
