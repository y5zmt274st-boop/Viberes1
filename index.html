<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIBES CLUB</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#111;
    color:#fff;
}

/* HEADER */
.header{
    text-align:center;
    padding: 20px 70px;
    background:#1a1a1a;
    border-bottom:1px solid #333;
    position:relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 40px;
}

.header h1{
    margin:0;
    font-size:24px;
    letter-spacing: 1px;
}

/* SETTINGS & ADMIN BUTTONS */
.settings-btn{
    position:absolute;
    top:15px;
    right:15px;
    width:45px;
    height:45px;
    background:#222;
    border: 1px solid #333;
    border-radius: 12px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:20px;
    z-index: 1000;
    transition: background 0.2s, border-color 0.2s;
}

.admin-btn{
    position:absolute;
    top:15px;
    left:15px;
    width:45px;
    height:45px;
    background:#222;
    border: 1px solid #333;
    border-radius: 12px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:20px;
    z-index: 1000;
    transition: background 0.2s, border-color 0.2s;
}

.settings-btn:hover, .admin-btn:hover{
    background: #2a2a2a;
    border-color: #555;
}

.admin-btn.logged-in{
    background:#ff4444;
    border-color: #ff6666;
}

.settings{
    position:absolute;
    top:70px;
    right:15px;
    width:180px;
    background:#1e1e1e;
    border-radius:12px;
    border: 1px solid #333;
    display:none;
    z-index: 1010;
    overflow: hidden;
}

.settings.active{
    display:block;
}

.lang{
    padding:12px;
    cursor:pointer;
    transition: background 0.2s;
}

.lang:hover{
    background:#333;        
}

/* TABS */
.tabs{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    padding:15px;
}

.tab{
    background:#222;
    padding:10px 16px;
    border-radius:10px;
    cursor:pointer;
}

.tab.active{
    background:red;
}

/* MENU */
.menu{
    display:none;
    max-width:800px;
    margin:auto;
    padding:15px;
}

.menu.active{
    display:block;
}

/* DRINK */
.drink{
    background:#1e1e1e;
    border-radius:12px;
    margin-bottom:10px;
    cursor:pointer;
    overflow:hidden;
    position:relative;
}

.drink-header{
    display:flex;
    justify-content:space-between;
    padding:15px;
    align-items:center;
}

.drink-header:hover{
    background:#2a2a2a;
}

.drink-actions{
    display:none;
    gap:8px;
}

.drink.admin-mode .drink-actions{
    display:flex;
}

.drink-actions button{
    background:#444;
    border:none;
    color:#fff;
    padding:5px 10px;
    border-radius:5px;
    cursor:pointer;
    font-size:12px;
}

.drink-actions button:hover{
    background:#666;
}

.drink-actions .delete-btn{
    background:#cc0000;
}

.drink-actions .delete-btn:hover{
    background:#ff0000;
}

.drink-info{
    display:none;
    padding:15px;
    border-top:1px solid #333;
    color:#ccc;
}

.drink.active .drink-info{
    display:block;
}

.price{
    color:red;
    font-weight:bold;
}

/* FOOTER */
.footer{
    text-align:center;
    padding:25px;
    color:#aaa;
    border-top:1px solid #333;
    margin-top:20px;
}

.address{
    margin-top:8px;
    color:#fff;
    font-size:14px;
}

/* MODAL */
.modal{
    display:none;
    position:fixed;
    z-index:1000;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background-color:rgba(0,0,0,0.7);
}

.modal.active{
    display:flex;
    align-items:center;
    justify-content:center;
}

.modal-content{
    background:#1e1e1e;
    padding:30px;
    border-radius:15px;
    max-width:500px;
    width:90%;
    border:1px solid #333;
    max-height:90vh;
    overflow-y:auto;
    position: relative;
}

.close-modal-btn {
    position: absolute;
    top: 15px;
    right: 15px;
    background: transparent;
    border: none;
    color: #aaa;
    font-size: 22px;
    cursor: pointer;
    line-height: 1;
    padding: 5px;
    transition: color 0.2s;
}

.close-modal-btn:hover {
    color: #ff0000;
}

.modal-content h2{
    margin-top:0;
    padding-right:30px;
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    padding:10px;
    border:1px solid #444;
    border-radius:5px;
    background:#222;
    color:#fff;
    box-sizing:border-box;
}

.form-group textarea{
    resize:vertical;
    min-height:80px;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
    outline:none;
    border-color:#ff0000;
}

.modal-buttons{
    display:flex;
    gap:10px;
    justify-content:flex-end;
}

.modal-buttons button{
    padding:10px 20px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-weight:bold;
}

.btn-save{
    background:#ff0000;
    color:#fff;
}

.btn-save:hover{
    background:#cc0000;
}

.btn-cancel{
    background:#444;
    color:#fff;
}

.btn-cancel:hover{
    background:#555;
}

.btn-add-drink{
    background:#ff0000;
    color:#fff;
    padding:10px 20px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    margin:15px auto;
    display:none;
}

.btn-add-drink.admin-mode{
    display:block;
}

.btn-add-drink:hover{
    background:#cc0000;
}

.error{
    color:#ff4444;
    font-size:14px;
    margin-top:5px;
}

.admin-panel-btn{
    background:#ff0000;
    color:#fff;
    padding:10px 20px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    margin-top:10px;
    width:100%;
    font-weight:bold;
}

.admin-panel-btn:hover{
    background:#cc0000;
}

.logout-btn{
    background:#cc0000;
    color:#fff;
    padding:10px 20px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    margin-top:10px;
    width:100%;
    font-weight:bold;
}

.logout-btn:hover{
    background:#990000;
}

.user-info{
    padding
