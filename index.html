```html
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VIBES CLUB</title>

<style>
body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

.header {
    text-align: center;
    padding: 20px;
}

.header h1 {
    margin: 0;
    font-size: 28px;
    letter-spacing: 2px;
}

#google_translate_element {
    text-align: center;
    margin: 10px;
}

.settings-btn {
    position: fixed;
    top: 12px;
    right: 12px;
    background: #2a2a2a;
    padding: 10px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 18px;
}

.settings {
    position: fixed;
    top: 55px;
    right: 12px;
    background: #1e1e1e;
    padding: 10px;
    border-radius: 12px;
    display: none;
    width: 160px;
}

.settings.active {
    display: block;
}

.lang {
    padding: 8px;
    cursor: pointer;
    border-radius: 8px;
}

.lang:hover {
    background: #333;
}

.tabs {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin: 15px;
}

.tab {
    background: #222;
    padding: 10px 16px;
    border-radius: 10px;
    cursor: pointer;
}

.tab.active {
    background: #ff0055;
}

.menu {
    display: none;
    max-width: 750px;
    margin: auto;
    padding: 15px;
}

.menu.active {
    display: block;
}

.item {
    display: flex;
    justify-content: space-between;
    padding: 12px;
    margin-bottom: 8px;
    background: #1e1e1e;
    border-radius: 10px;
}

.footer {
    text-align: center;
    margin-top: 30px;
    padding: 20px;
}

.age {
    color: red;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="settings-btn" onclick="toggleSettings()">⚙️</div>

<div class="settings" id="settings">
    <div class="lang" onclick="setLang('de')">🇩🇪 Deutsch</div>
    <div class="lang" onclick="setLang('en')">🇬🇧 English</div>
    <div class="lang" onclick="setLang('ru')">🇷🇺 Русский</div>
    <div class="lang" onclick="setLang('pl')">🇵🇱 Polski</div>
</div>

<div class="header">
    <h1 id="title">VIBES CLUB</h1>
</div>

<div id="google_translate_element"></div>

<div class="tabs">
    <div class="tab active" onclick="openTab(event,'cocktails')">Cocktails</div>
    <div class="tab" onclick="openTab(event,'longdrinks')">Longdrinks</div>
    <div class="tab" onclick="openTab(event,'likor')">Liköre</div>
    <div class="tab" onclick="openTab(event,'shots')">Shots</div>
    <div class="tab" onclick="openTab(event,'flaschen')">Flaschen</div>
</div>

<div id="cocktails" class="menu active">
    <div class="item">
        <span>Напиток</span>
        <span>Цена</span>
    </div>
</div>

<div id="longdrinks" class="menu">
    <div class="item">
        <span>Напиток</span>
        <span>Цена</span>
    </div>
</div>

<div id="likor" class="menu">
    <div class="item">
        <span>Напиток</span>
        <span>Цена</span>
    </div>
</div>

<div id="shots" class="menu">
    <div class="item">
        <span>Напиток</span>
        <span>Цена</span>
    </div>
</div>

<div id="flaschen" class="menu">
    <div class="item">
        <span>Напиток</span>
        <span>Цена</span>
    </div>
</div>

<div class="footer">
    <div class="age">18+</div>
    <div>VIBES CLUB</div>
</div>

<script>
function openTab(event, tab) {
    document.querySelectorAll('.menu').forEach(menu => {
        menu.classList.remove('active');
    });

    document.querySelectorAll('.tab').forEach(tabBtn => {
        tabBtn.classList.remove('active');
    });

    document.getElementById(tab).classList.add('active');
    event.target.classList.add('active');
}

function toggleSettings() {
    document.getElementById('settings').classList.toggle('active');
}

function setLang(lang) {
    document.getElementById('settings').classList.remove('active');
}
</script>

<script>
function googleTranslateElementInit() {
    new google.translate.TranslateElement({
        pageLanguage: 'de',
        includedLanguages: 'de,en,ru,pl',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE
    }, 'google_translate_element');
}
</script>

<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
